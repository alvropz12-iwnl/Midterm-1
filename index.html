<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">

  <title>Rock, Paper, Scissors, Lizard, Spock</title>

  <style>
    /* ==========================================================================
       RULES MODAL
       ========================================================================== */

    body.modal-open {
      overflow: hidden;
    }

    /* Medido en design/mobile-step-1-bonus.jpg (375x750): la fila baja de
       badges termina en y=523 y el boton arranca en y=653, o sea 130px de
       aire, y su base queda a 57px del fondo. */
    .nav {
      display: flex;
      justify-content: center;
      margin-top: 130px;
      padding: 0 2rem 57px;
    }

    @media (min-width: 48rem) {
      .nav {
        justify-content: flex-end;
        margin-top: 0;
        padding: 0 2rem 32px;
      }
    }

    .rules-button,
    .rules-modal__close {
      font: inherit;
    }

    .rules-button {
      min-width: 8rem;
      padding: 0.65rem 2rem;
      border: 2px solid hsla(0, 0%, 100%, 0.7);
      border-radius: 0.55rem;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.18rem;
      text-transform: uppercase;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .rules-button:hover,
    .rules-button:focus-visible {
      background: #fff;
      color: var(--text-dark);
    }

    .rules-button:focus-visible,
    .rules-modal__close:focus-visible {
      outline: 3px solid hsl(189, 59%, 53%);
      outline-offset: 4px;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: hsla(237, 49%, 8%, 0.78);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .rules-modal {
      width: min(25rem, 100%);
      padding: 2rem;
      border-radius: 0.6rem;
      background: #fff;
      box-shadow: 0 1.5rem 4rem hsla(237, 49%, 8%, 0.4);
    }

    .rules-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
    }

    .rules-modal__title {
      margin: 0;
      color: var(--text-dark);
      font-size: 2rem;
      line-height: 1;
      text-transform: uppercase;
    }

    .rules-modal__close {
      display: grid;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      place-items: center;
    }

    .rules-modal__close img {
      width: 1.25rem;
      height: 1.25rem;
    }

    .rules-modal__diagram {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 37.5rem) {
      .rules-button {
        min-width: 8.125rem;
      }

      .modal-backdrop {
        padding: 0;
      }

      .rules-modal {
        display: flex;
        width: 100%;
        min-height: 100vh;
        padding: 2rem;
        border-radius: 0;
        flex-direction: column;
      }

      /* El header se disuelve para que titulo, diagrama y la X sean
         hermanos en la columna y la X pueda irse al fondo. */
      .rules-modal__header {
        display: contents;
      }

      .rules-modal__title {
        order: 1;
        margin-bottom: clamp(3rem, 12vh, 6rem);
        text-align: center;
      }

      .rules-modal__diagram {
        order: 2;
        width: min(21rem, 100%);
        margin: 0 auto;
      }

      .rules-modal__close {
        order: 3;
        margin: auto auto 0;
        padding-top: clamp(3rem, 12vh, 6rem);
        height: auto;
      }
    }
  </style>

</head>
<body>

  <div class="game">

    <!-- 1. HEADING -->
    <header class="heading">
      <h1 class="logo-container">
        <span class="logo-line">Rock</span>
        <span class="logo-line">Paper</span>
        <span class="logo-line">Scissors</span>
        <span class="logo-line">Lizard</span>
        <span class="logo-line">Spock</span>
      </h1>

      <div class="score-container">
        <p class="score-label">Score</p>
        <p class="score-value" id="score" aria-live="polite">0</p>
      </div>
    </header>

    <!-- 2. MATCHPORT -->
    <main class="matchport" id="matchport" data-step="1">

      <!-- STEP 1: the five options.
           Every badge is the same component: same markup, one modifier class.
           The modifier only sets the ring colour and where it sits. -->
      <div class="picks" id="picks">

        <img class="picks__pentagon" src="./images/bg-pentagon.svg" alt="">

        <button class="pick pick--scissors" type="button" data-pick="scissors">
          <span class="pick__disc">
            <img class="pick__icon" src="./images/icon-scissors.svg" alt="">
          </span>
          <span class="visually-hidden">Scissors</span>
        </button>

        <button class="pick pick--spock" type="button" data-pick="spock">
          <span class="pick__disc">
            <img class="pick__icon" src="./images/icon-spock.svg" alt="">
          </span>
          <span class="visually-hidden">Spock</span>
        </button>

        <button class="pick pick--paper" type="button" data-pick="paper">
          <span class="pick__disc">
            <img class="pick__icon" src="./images/icon-paper.svg" alt="">
          </span>
          <span class="visually-hidden">Paper</span>
        </button>

        <button class="pick pick--lizard" type="button" data-pick="lizard">
          <span class="pick__disc">
            <img class="pick__icon" src="./images/icon-lizard.svg" alt="">
          </span>
          <span class="visually-hidden">Lizard</span>
        </button>

        <button class="pick pick--rock" type="button" data-pick="rock">
          <span class="pick__disc">
            <img class="pick__icon" src="./images/icon-rock.svg" alt="">
          </span>
          <span class="visually-hidden">Rock</span>
        </button>

      </div>

      <!-- STEPS 2, 3 and 4: the match -->
      <div class="match" id="match" hidden aria-live="polite">

        <div class="match__side" id="user-side">
          <p class="match__label">You Picked</p>
          <div class="match__slot" id="user-pick"></div>
        </div>

        <div class="match__outcome" id="outcome" hidden>
          <p class="match__result" id="result" aria-live="polite"></p>
          <button class="btn-play-again" type="button" id="play-again">Play Again</button>
        </div>

        <div class="match__side" id="house-side">
          <p class="match__label">The House Picked</p>
          <div class="match__slot match__slot--empty" id="house-pick"></div>
        </div>

      </div>

    </main>

    <!-- 3. NAV -->
    <nav class="nav">
      <section class="rules-container" aria-label="Game rules">
        <button
          class="rules-button"
          type="button"
          id="open-rules"
          aria-haspopup="dialog"
          aria-controls="rules-dialog"
          aria-expanded="false"
        >
          Rules
        </button>
      </section>
    </nav>

  </div>

  <!-- Rules modal -->
  <div class="modal-backdrop" id="rules-backdrop" hidden>
    <section
      class="rules-modal"
      id="rules-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="rules-title"
    >
      <header class="rules-modal__header">
        <h2 class="rules-modal__title" id="rules-title">Rules</h2>
        <button class="rules-modal__close" type="button" id="close-rules" aria-label="Close rules">
          <img src="./images/icon-close.svg" alt="">
        </button>
      </header>

      <img
        class="rules-modal__diagram"
        src="./images/image-rules-bonus.svg"
        alt="Rock Paper Scissors Lizard Spock winning combinations"
      >
    </section>
  </div>

  <script>
    const openButton = document.getElementById("open-rules");
    const closeButton = document.getElementById("close-rules");
    const backdrop = document.getElementById("rules-backdrop");

    function openRules() {
      backdrop.hidden = false;
      openButton.setAttribute("aria-expanded", "true");
      document.body.classList.add("modal-open");
      closeButton.focus();
    }

    function closeRules() {
      backdrop.hidden = true;
      openButton.setAttribute("aria-expanded", "false");
      document.body.classList.remove("modal-open");
      openButton.focus();
    }

    openButton.addEventListener("click", openRules);
    closeButton.addEventListener("click", closeRules);
    backdrop.addEventListener("click", (event) => {
      if (event.target === backdrop) closeRules();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !backdrop.hidden) closeRules();
    });
  </script>

  <script src="./js/game.js"></script>
</body>
</html>
